# =============================================================================
# JK-BMS (BLE) -> ESP32-C3 Super Mini -> Home Assistant
# Based on syssi/esphome-jk-bms, with an added ESTIMATED State of Health (SoH)
# calculated from the BMS charging-cycle counter.
# =============================================================================

# ---- SUBSTITUTIONS: reusable values, referenced below as ${name} ------------
substitutions:
  # Device name (shows up in ESPHome and Home Assistant)
  name: jk-bms
  # Description of the device
  device_description: "Monitor and control a JK-BMS via bluetooth"
  # Where the JK-BMS BLE component code is downloaded from
  external_components_source: github://syssi/esphome-jk-bms@main
  # BMS protocol version - pick the one matching your BMS:
  # JK02_24S : old JK-BMS, hardware version >= 6.0 and < 11.0
  # JK02_32S : new JK-BMS, hardware version >= 11.0
  # JK04     : very old JK-BMS, hardware version <= 3.0
  # Active protocol selection
  protocol_version: JK02_32S

  # ---- SoH model settings (edit these to match your battery datasheet) ------
  soh_rated_cycles: "6000"   # cycles the battery is rated for ...
  soh_end_of_life: "80.0"    # ... until it reaches this SoH (%)

# ---- CORE ESPHOME SETTINGS -------------------------------------------------
esphome:
  name: ${name}

# ---- HARDWARE: ESP32-C3 board and framework -------------------------------
esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# ---- EXTERNAL COMPONENT: downloads syssi's JK-BMS driver --------------------
external_components:
  - source: ${external_components_source}
    refresh: 0s   # 0s = always re-check for updates when compiling

# ---- WIFI: credentials come from secrets.yaml -------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

# ---- OTA: wireless firmware updates -----------------------------------------
ota:
  platform: esphome
  on_begin:   # runs when an OTA update starts
    then:
      # Stop BLE first so the ESP32 has enough resources/RAM for the update
      - switch.turn_off: ble_client_switch0
      # Write a note to the log
      - logger.log: "BLE connection suspended for OTA update"

# ---- LOGGER: debug output (view in ESPHome logs) ----------------------------
logger:
  level: DEBUG
  logs:
    # Reduce noisy BLE messages to INFO level
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

# ---- API: native connection to Home Assistant -------------------------------
# If you don't use Home Assistant please remove this `api` section and use `mqtt`.
api:
  encryption:
    key: "XXX"   # <-- put your own API encryption key here

# ---- BLE TRACKER: scans for Bluetooth devices -------------------------------
esp32_ble_tracker:
  scan_parameters:
    active: false   # passive scan = less power and less BLE traffic

# ---- BLE CLIENT: the Bluetooth connection to your JK-BMS --------------------
ble_client:
  # MAC address of the BMS, stored in secrets.yaml
  - mac_address: !secret bms0_mac_address
    id: client0   # id used to link other components to this connection

# ---- JK BMS HUB: the main BMS driver ----------------------------------------
jk_bms_ble:
  # Which BLE connection to use
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 5s   # only publish new data every 5 s (reduces load)
    id: bms0       # id used by the sensors/numbers/switches below

# ---- BINARY SENSORS: on/off status flags ------------------------------------
binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "balancing"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    heating:
      name: "heating"
    online_status:
      name: "online status"

# ---- BUTTONS: trigger actions on the BMS ------------------------------------
button:
  - platform: jk_bms_ble
    retrieve_settings:
      name: "retrieve settings"
    retrieve_device_info:
      name: "retrieve device info"
    retrieve_logbook:
      name: "retrieve logbook"

# ---- NUMBERS: BMS settings you can read and change from Home Assistant -----
# (battery capacity, voltage limits, current limits, temperature limits ...)
number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balance_trigger_voltage:
      name: "balance trigger voltage"

    cell_count:
      name: "cell count"

    total_battery_capacity:
      name: "total battery capacity"

    cell_voltage_overvoltage_protection:
      name: "cell voltage overvoltage protection"

    cell_voltage_overvoltage_recovery:
      name: "cell voltage overvoltage recovery"

    cell_voltage_undervoltage_protection:
      name: "cell voltage undervoltage protection"

    cell_voltage_undervoltage_recovery:
      name: "cell voltage undervoltage recovery"

    balancing_start_voltage:
      name: "balancing start voltage"

    voltage_calibration:
      name: "voltage calibration"

    current_calibration:
      name: "current calibration"

    power_off_voltage:
      name: "power off voltage"

    max_balance_current:
      name: "max balance current"

    max_charge_current:
      name: "max charge current"

    max_discharge_current:
      name: "max discharge current"

    charge_overcurrent_protection_delay:
      name: "charge overcurrent protection delay"

    charge_overcurrent_protection_recovery_time:
      name: "charge overcurrent protection recovery time"

    discharge_overcurrent_protection_delay:
      name: "discharge overcurrent protection delay"

    discharge_overcurrent_protection_recovery_time:
      name: "discharge overcurrent protection recovery time"

    short_circuit_protection_delay:
      name: "short circuit protection delay"

    short_circuit_protection_recovery_time:
      name: "short circuit protection recovery time"

    charge_overtemperature_protection:
      name: "charge overtemperature protection"

    charge_overtemperature_protection_recovery:
      name: "charge overtemperature protection recovery"

    discharge_overtemperature_protection:
      name: "discharge overtemperature protection"

    discharge_overtemperature_protection_recovery:
      name: "discharge overtemperature protection recovery"

    charge_undertemperature_protection:
      name: "charge undertemperature protection"

    charge_undertemperature_protection_recovery:
      name: "charge undertemperature protection recovery"

    mosfet_overtemperature_protection:
      name: "mosfet overtemperature protection"

    mosfet_overtemperature_protection_recovery:
      name: "mosfet overtemperature protection recovery"

# ---- SENSORS ----------------------------------------------------------------
sensor:
  # ---- 1) Data read directly from the BMS ----
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0

    # Cell voltage statistics (min/max/delta/average)
    min_cell_voltage:
      name: "min cell voltage"

    max_cell_voltage:
      name: "max cell voltage"

    min_voltage_cell:
      name: "min voltage cell"

    max_voltage_cell:
      name: "max voltage cell"

    delta_cell_voltage:
      name: "delta cell voltage"

    average_cell_voltage:
      name: "average cell voltage"

    # Individual cell voltages (24 slots; unused cells just stay unavailable)
    cell_voltage_1:
      name: "cell voltage 1"

    cell_voltage_2:
      name: "cell voltage 2"

    cell_voltage_3:
      name: "cell voltage 3"

    cell_voltage_4:
      name: "cell voltage 4"

    cell_voltage_5:
      name: "cell voltage 5"

    cell_voltage_6:
      name: "cell voltage 6"

    cell_voltage_7:
      name: "cell voltage 7"

    cell_voltage_8:
      name: "cell voltage 8"

    cell_voltage_9:
      name: "cell voltage 9"

    cell_voltage_10:
      name: "cell voltage 10"

    cell_voltage_11:
      name: "cell voltage 11"

    cell_voltage_12:
      name: "cell voltage 12"

    cell_voltage_13:
      name: "cell voltage 13"

    cell_voltage_14:
      name: "cell voltage 14"

    cell_voltage_15:
      name: "cell voltage 15"

    cell_voltage_16:
      name: "cell voltage 16"

    cell_voltage_17:
      name: "cell voltage 17"

    cell_voltage_18:
      name: "cell voltage 18"

    cell_voltage_19:
      name: "cell voltage 19"

    cell_voltage_20:
      name: "cell voltage 20"

    cell_voltage_21:
      name: "cell voltage 21"

    cell_voltage_22:
      name: "cell voltage 22"

    cell_voltage_23:
      name: "cell voltage 23"

    cell_voltage_24:
      name: "cell voltage 24"

    # Individual cell wire/connection resistances
    cell_resistance_1:
      name: "cell resistance 1"

    cell_resistance_2:
      name: "cell resistance 2"

    cell_resistance_3:
      name: "cell resistance 3"

    cell_resistance_4:
      name: "cell resistance 4"

    cell_resistance_5:
      name: "cell resistance 5"

    cell_resistance_6:
      name: "cell resistance 6"

    cell_resistance_7:
      name: "cell resistance 7"

    cell_resistance_8:
      name: "cell resistance 8"

    cell_resistance_9:
      name: "cell resistance 9"

    cell_resistance_10:
      name: "cell resistance 10"

    cell_resistance_11:
      name: "cell resistance 11"

    cell_resistance_12:
      name: "cell resistance 12"

    cell_resistance_13:
      name: "cell resistance 13"

    cell_resistance_14:
      name: "cell resistance 14"

    cell_resistance_15:
      name: "cell resistance 15"

    cell_resistance_16:
      name: "cell resistance 16"

    cell_resistance_17:
      name: "cell resistance 17"

    cell_resistance_18:
      name: "cell resistance 18"

    cell_resistance_19:
      name: "cell resistance 19"

    cell_resistance_20:
      name: "cell resistance 20"

    cell_resistance_21:
      name: "cell resistance 21"

    cell_resistance_22:
      name: "cell resistance 22"

    cell_resistance_23:
      name: "cell resistance 23"

    cell_resistance_24:
      name: "cell resistance 24"

    # Pack-level measurements: voltage, current, power
    total_voltage:
      name: "total voltage"

    current:
      name: "current"

    heating_current:
      name: "heating current"

    power:
      name: "power"

    charging_power:
      name: "charging power"

    discharging_power:
      name: "discharging power"

    # Temperature probes and MOSFET temperature
    temperature_sensor_1:
      name: "temperature sensor 1"

    temperature_sensor_2:
      name: "temperature sensor 2"

    temperature_sensor_3:
      name: "temperature sensor 3"

    temperature_sensor_4:
      name: "temperature sensor 4"

    mosfet_temperature:
      name: "mosfet temperature"

    # Balancer, capacity, runtime and counters
    balancer_status_bitmask:
      name: "balancer status bitmask"

    state_of_charge:
      name: "state of charge"

    capacity_remaining:
      name: "capacity remaining"

    full_charge_capacity:
      name: "full charge capacity"

    total_charging_cycle_capacity:
      name: "total charging cycle capacity"

    total_runtime:
      name: "total runtime"

    power_on_count:
      name: "power on count"

    balancing_current:
      name: "balancing current"

    # Cycle counter reported by the BMS.
    # The 'id' lets the SoH template sensors below read this value.
    charging_cycles:
      name: "charging cycles"
      id: bms_charging_cycles

  # ===========================================================================
  # 2) ESTIMATED STATE OF HEALTH (calculated on the ESP32, NOT read from BMS)
  #
  #   loss per cycle = (100 - end_of_life) / rated_cycles
  #                  = (100 - 80) / 6000 = 0.003333 % per cycle
  #   SoH            = 100 - (cycles * loss per cycle)      (clamped 0..100)
  # ===========================================================================
  - platform: template                    # a sensor whose value is computed by our code
    name: "State of Health (Estimated)"   # name shown in Home Assistant
    id: soh_estimated                     # internal id (use it in other automations)
    unit_of_measurement: "%"              # displayed as a percentage
    icon: mdi:battery-heart-variant       # icon in Home Assistant
    state_class: measurement              # lets HA keep long-term statistics/graphs
    accuracy_decimals: 2                  # show 2 decimals, e.g. 98.33 %
    update_interval: 30s                  # recalculate every 30 seconds
    lambda: |-
      // STEP 1: if the BMS has not sent a cycle count yet, publish nothing.
      // (returning {} = "no value", avoids a false 100 % right after boot)
      if (!id(bms_charging_cycles).has_state()) return {};

      // STEP 2: read the current cycle count from the BMS sensor.
      const float cycles = id(bms_charging_cycles).state;

      // STEP 3: ignore invalid readings (NaN = "not a number").
      if (std::isnan(cycles)) return {};

      // STEP 4: calculate the SoH lost per cycle.
      // (100 - 80) / 6000 = 0.003333 % per cycle with the default substitutions.
      // static_cast<float> converts the substitution text to a decimal number.
      const float loss_per_cycle = (100.0f - static_cast<float>(${soh_end_of_life})) / static_cast<float>(${soh_rated_cycles});

      // STEP 5: SoH = 100 % minus total loss so far.
      float soh = 100.0f - (cycles * loss_per_cycle);

      // STEP 6: keep the result inside a sensible 0 - 100 % range.
      if (soh > 100.0f) soh = 100.0f;
      if (soh < 0.0f) soh = 0.0f;

      // STEP 7: publish the value to Home Assistant.
      return soh;

  # Cycles left until the battery reaches the end-of-life SoH (80 %)
  - platform: template                    # another calculated sensor
    name: "Cycles Remaining To End Of Life"
    id: cycles_remaining_eol
    unit_of_measurement: "cycles"
    icon: mdi:battery-sync
    state_class: measurement
    accuracy_decimals: 0                  # whole numbers only
    update_interval: 30s                  # recalculate every 30 seconds
    lambda: |-
      // STEP 1: wait until the BMS has reported a cycle count.
      if (!id(bms_charging_cycles).has_state()) return {};

      // STEP 2: read the current cycle count.
      const float cycles = id(bms_charging_cycles).state;

      // STEP 3: ignore invalid readings.
      if (std::isnan(cycles)) return {};

      // STEP 4: remaining = rated cycles (6000) - cycles already used.
      float remaining = static_cast<float>(${soh_rated_cycles}) - cycles;

      // STEP 5: never show a negative number once past the rated life.
      if (remaining < 0.0f) remaining = 0.0f;

      // STEP 6: publish the value to Home Assistant.
      return remaining;

# ---- SWITCHES: turn BMS functions on/off from Home Assistant ----------------
switch:
  # Charge MOSFET, discharge MOSFET and balancer switches
  - platform: jk_bms_ble
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    balancer:
      name: "balancer"
  # Master switch to enable/disable the Bluetooth connection
  # (also used by OTA to pause BLE during updates)
  - platform: ble_client
    ble_client_id: client0
    name: "enable bluetooth connection"
    id: ble_client_switch0

# ---- TEXT SENSORS: errors, versions, serial number --------------------------
text_sensor:
  - platform: jk_bms_ble
    errors:
      name: "errors"
    errors_bitmask_hex:
      name: "errors bitmask hex"
    balancer_status:
      name: "balancer status"
    total_runtime_formatted:
      name: "total runtime formatted"
    software_version:
      name: "software version"
    hardware_version:
      name: "hardware version"
    device_model:
      name: "device model"
    manufacturing_date:
      name: "manufacturing date"
    serial_number:
      name: "serial number"
