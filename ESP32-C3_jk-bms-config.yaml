    capacity_remaining:
      name: "capacity remaining"

    full_charge_capacity:
      name: "full charge capacity"

    total_charging_cycle_capacity:
      name: "total charging cycle capacity"

    total_runtime:
      name: "total runtime"

    power_on_count:
      name: "power on count"

    balancing_current:
      name: "balancing current"

    charging_cycles:
      name: "charging cycles"
      id: bms_charging_cycles

  # SoH sensors: simple, advanced, measured
  - platform: template
    name: "State of Health (Estimated)"
    id: soh_estimated
    unit_of_measurement: "%"
    icon: mdi:battery-heart-variant
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      if (!id(bms_charging_cycles).has_state()) return {};

      const float cycles = id(bms_charging_cycles).state;

      if (std::isnan(cycles)) return {};

      const float loss_per_cycle = (100.0f - static_cast<float>(${soh_end_of_life})) / static_cast<float>(${soh_rated_cycles});

      float soh = 100.0f - (cycles * loss_per_cycle);

      if (soh > 100.0f) soh = 100.0f;
      if (soh < 0.0f) soh = 0.0f;

      return soh;

  - platform: template
    name: "Cycles Remaining To End Of Life"
    id: cycles_remaining_eol
    unit_of_measurement: "cycles"
    icon: mdi:battery-sync
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(bms_charging_cycles).has_state()) return {};

      const float cycles = id(bms_charging_cycles).state;

      if (std::isnan(cycles)) return {};

      float remaining = static_cast<float>(${soh_rated_cycles}) - cycles;

      if (remaining < 0.0f) remaining = 0.0f;

      return remaining;

  - platform: template
    name: "State of Health (Advanced Estimate)"
    id: soh_advanced
    unit_of_measurement: "%"
    icon: mdi:battery-heart-variant
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      if (!id(soh_seeded)) return {};
      float soh = 100.0f - static_cast<float>(id(soh_total_loss));
      if (soh > 100.0f) soh = 100.0f;
      if (soh < 0.0f) soh = 0.0f;
      return soh;

  - platform: template
    name: "Battery Aging Stress Factor"
    id: aging_stress_factor
    unit_of_measurement: "x"
    icon: mdi:thermometer-alert
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      return id(soh_stress_now);

  - platform: template
    name: "Equivalent Full Cycles (Tracked)"
    id: equiv_full_cycles
    unit_of_measurement: "cycles"
    icon: mdi:counter
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return static_cast<float>(id(soh_equiv_cycles));

  - platform: template
    name: "Last Measured Capacity"
    id: last_measured_capacity
    unit_of_measurement: "Ah"
    icon: mdi:battery-check
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (id(soh_last_cap) <= 0.0) return {};
      return static_cast<float>(id(soh_last_cap));

  - platform: template
    name: "State of Health (Measured)"
    id: soh_measured
    unit_of_measurement: "%"
    icon: mdi:battery-heart
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (id(soh_last_cap) <= 0.0) return {};
      float soh = 100.0f * static_cast<float>(id(soh_last_cap)) / static_cast<float>(${soh_pack_capacity_ah});
      if (soh > 100.0f) soh = 100.0f;
      return soh;

switch:
  - platform: jk_bms_ble
    charging:
