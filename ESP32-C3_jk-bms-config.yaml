# =============================================================================
# JK-BMS (BLE) -> ESP32-C3 Super Mini -> Home Assistant
# Based on syssi/esphome-jk-bms, with an added ESTIMATED State of Health (SoH)
# calculated from the BMS charging-cycle counter, plus an ADVANCED SoH estimate
# that also considers temperature, C-rate (current) and calendar time.
# =============================================================================

# ---- SUBSTITUTIONS: reusable values, referenced below as ${name} ------------
substitutions:
  # Device name (shows up in ESPHome and Home Assistant)
  name: jk-bms
  # Description of the device
  device_description: "Monitor and control a JK-BMS via bluetooth"
  # Where the JK-BMS BLE component code is downloaded from
  external_components_source: github://syssi/esphome-jk-bms@main
  # BMS protocol version - pick the one matching your BMS:
  # JK02_24S : old JK-BMS, hardware version >= 6.0 and < 11.0
  # JK02_32S : new JK-BMS, hardware version >= 11.0
  # JK04     : very old JK-BMS, hardware version <= 3.0
  # Active protocol selection
  protocol_version: JK02_32S

  # ---- SoH model settings (edit these to match your battery datasheet) ------
  # Values below are from the Highstar IFpP40130220-100 (100 Ah LFP) datasheet:
  # "Cycle life >= 5000 cycles" until capacity falls below 80 % (sheet 7, item 11)
  soh_rated_cycles: "5000"   # cycles the battery is rated for ...
  soh_end_of_life: "80.0"    # ... until it reaches this SoH (%)

  # ---- ADVANCED SoH model settings -----------------------------------------
  # The datasheet rating above is assumed to be measured at the REFERENCE
  # conditions below. At these conditions the advanced model wears the battery
  # at exactly the datasheet rate. Hotter / higher current = faster wear.
  # NOTE: stress factors and calendar loss are ASSUMPTIONS (typical LFP values),
  # not lab-fitted constants. Adjust them if your datasheet says otherwise.
  soh_pack_capacity_ah: "100"        # total pack Ah. 16S1P of 100 Ah cells = 100 (16S2P would be 200)
  soh_ref_temp_c: "25.0"             # datasheet cycle test is at 23 +/- 5 deg C
  soh_ref_c_rate: "0.5"              # datasheet cycle test: 150 W per cell (about 0.5C = 50 A on 100 Ah)
  soh_temp_doubling_c: "10.0"        # wear doubles for every +10 deg C above reference
  soh_c_rate_gamma: "0.5"            # extra wear per 1C above the reference C-rate
  soh_calendar_loss_per_year: "1.0"  # % capacity lost per year just from age at ref temp (0 = disable)

# ---- CORE ESPHOME SETTINGS -------------------------------------------------
esphome:
  name: ${name}

# ---- PREFERENCES: how often saved values are written to flash ---------------
# The advanced SoH total is stored in flash so it survives reboots/power cuts.
# Flash wears out if written too often, so write only every 30 minutes.
# (A power cut can lose at most the last 30 minutes of accumulated wear.)
preferences:
  flash_write_interval: 30min

# ---- HARDWARE: ESP32-C3 board and framework -------------------------------
esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# ---- EXTERNAL COMPONENT: downloads syssi's JK-BMS driver --------------------
external_components:
  - source: ${external_components_source}
    refresh: 0s   # 0s = always re-check for updates when compiling

# ---- WIFI: credentials come from secrets.yaml -------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

# ---- OTA: wireless firmware updates -----------------------------------------
ota:
  platform: esphome
  on_begin:   # runs when an OTA update starts
    then:
      # Stop BLE first so the ESP32 has enough resources/RAM for the update
      - switch.turn_off: ble_client_switch0
      # Write a note to the log
      - logger.log: "BLE connection suspended for OTA update"

# ---- GLOBALS: variables that live in memory (some are saved to flash) -------
globals:
  # Total capacity lost so far, in percent (e.g. 2.0 = battery at 98.00 % SoH)
  # (double = high precision, because each 10 s step adds a VERY tiny amount)
  - id: soh_total_loss
    type: double
    restore_value: yes        # saved to flash, survives reboot
    initial_value: '0.0'

  # Has the loss total been seeded from the BMS cycle count yet?
  # (so a battery that already has cycles does not start at 100 %)
  - id: soh_seeded
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Equivalent full cycles counted by the ESP32 (energy throughput based)
  - id: soh_equiv_cycles
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Current combined stress multiplier (1.0 = datasheet conditions)
  - id: soh_stress_now
    type: float
    restore_value: no
    initial_value: '1.0'

# ---- INTERVAL: runs the advanced SoH calculation every 10 seconds ------------
interval:
  - interval: 10s
    then:
      - lambda: |-
          // ---- STEP 1: loss per cycle at datasheet conditions (% per full cycle)
          // (100 - 80) / 5000 = 0.004 % with the default substitutions
          // (double precision: the per-step amounts are tiny, float would round them away)
          const double loss_per_cycle = (100.0 - static_cast<double>(${soh_end_of_life})) / static_cast<double>(${soh_rated_cycles});

          // ---- STEP 2: seed the total once from the BMS cycle count.
          // A battery that already has e.g. 500 cycles starts at 98.00 %, not 100 %.
          // After seeding, only NEW wear is added (with temperature/current stress).
          if (!id(soh_seeded)) {
            if (!id(bms_charging_cycles).has_state()) return;   // wait for BMS data
            const float c0 = id(bms_charging_cycles).state;
            if (std::isnan(c0)) return;
            id(soh_total_loss) = c0 * loss_per_cycle;
            id(soh_seeded) = true;
          }

          // ---- STEP 3: average battery temperature from probes 1 and 2.
          // If no probe value is available, assume the reference temperature.
          float t_sum = 0.0f;
          int t_n = 0;
          if (id(bms_temp1).has_state() && !std::isnan(id(bms_temp1).state)) { t_sum += id(bms_temp1).state; t_n++; }
          if (id(bms_temp2).has_state() && !std::isnan(id(bms_temp2).state)) { t_sum += id(bms_temp2).state; t_n++; }
          const float temp_c = (t_n > 0) ? (t_sum / t_n) : static_cast<float>(${soh_ref_temp_c});

          // ---- STEP 4: absolute pack current in amps (charge OR discharge both wear).
          float amps = 0.0f;
          if (id(bms_current).has_state() && !std::isnan(id(bms_current).state)) {
            amps = std::fabs(id(bms_current).state);
          }

          // ---- STEP 5: temperature stress factor (Arrhenius-style rule of thumb).
          // 1.0 at/below the reference temp, 2.0 at +10 C, 4.0 at +20 C. Capped at 4.
          // No "bonus" is given for cold, which is the conservative choice.
          float temp_factor = std::pow(2.0f, (temp_c - static_cast<float>(${soh_ref_temp_c})) / static_cast<float>(${soh_temp_doubling_c}));
          if (temp_factor < 1.0f) temp_factor = 1.0f;
          if (temp_factor > 4.0f) temp_factor = 4.0f;

          // ---- STEP 6: C-rate stress factor (current divided by capacity).
          // 1.0 up to the reference C-rate; grows linearly above it. Capped at 3.
          const float cap_ah = static_cast<float>(${soh_pack_capacity_ah});
          const float c_rate = amps / cap_ah;
          float c_factor = 1.0f;
          if (c_rate > static_cast<float>(${soh_ref_c_rate})) {
            c_factor = 1.0f + static_cast<float>(${soh_c_rate_gamma}) * (c_rate - static_cast<float>(${soh_ref_c_rate}));
          }
          if (c_factor > 3.0f) c_factor = 3.0f;

          // ---- STEP 7: time step: this block runs every 10 s = 10/3600 hours.
          const double dt_h = 10.0 / 3600.0;

          // ---- STEP 8: cycling wear.
          // Ah moved in this step, converted to "equivalent full cycles":
          // one full cycle = charge + discharge = 2 x pack capacity of throughput.
          const double efc_step = (static_cast<double>(amps) * dt_h) / (2.0 * cap_ah);
          id(soh_equiv_cycles) += efc_step;
          const double loss_cycling = efc_step * loss_per_cycle * temp_factor * c_factor;

          // ---- STEP 9: calendar wear (loss from age alone, faster when hot).
          const double loss_calendar = (static_cast<double>(${soh_calendar_loss_per_year}) / 8760.0) * dt_h * temp_factor;

          // ---- STEP 10: add both to the running total (in %) and keep it sane.
          id(soh_total_loss) += loss_cycling + loss_calendar;
          if (id(soh_total_loss) > 100.0) id(soh_total_loss) = 100.0;
          if (id(soh_total_loss) < 0.0) id(soh_total_loss) = 0.0;

          // ---- STEP 11: remember the stress level (shown as a sensor for transparency).
          id(soh_stress_now) = (amps > 0.0f) ? (temp_factor * c_factor) : temp_factor;

# ---- LOGGER: debug output (view in ESPHome logs) ----------------------------
logger:
  level: DEBUG
  logs:
    # Reduce noisy BLE messages to INFO level
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

# ---- API: native connection to Home Assistant -------------------------------
# If you don't use Home Assistant please remove this `api` section and use `mqtt`.
api:
  encryption:
    key: "XXXXXXXXXX"

# ---- BLE TRACKER: scans for Bluetooth devices -------------------------------
esp32_ble_tracker:
  scan_parameters:
    active: false   # passive scan = less power and less BLE traffic

# ---- BLE CLIENT: the Bluetooth connection to your JK-BMS --------------------
ble_client:
  # MAC address of the BMS, stored in secrets.yaml
  - mac_address: !secret bms0_mac_address
    id: client0   # id used to link other components to this connection

# ---- JK BMS HUB: the main BMS driver ----------------------------------------
jk_bms_ble:
  # Which BLE connection to use
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 5s   # only publish new data every 5 s (reduces load)
    id: bms0       # id used by the sensors/numbers/switches below

# ---- BINARY SENSORS: on/off status flags ------------------------------------
binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "balancing"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    heating:
      name: "heating"
    online_status:
      name: "online status"

# ---- BUTTONS: trigger actions on the BMS ------------------------------------
button:
  # Re-seed the advanced SoH from the BMS cycle count (use after replacing the
  # battery or if you want to restart the tracking from the cycle-based value)
  - platform: template
    name: "Reset Advanced SoH Tracking"
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: |-
          id(soh_seeded) = false;
          id(soh_equiv_cycles) = 0.0;

  - platform: jk_bms_ble
    retrieve_settings:
      name: "retrieve settings"
    retrieve_device_info:
      name: "retrieve device info"
    retrieve_logbook:
      name: "retrieve logbook"

# ---- NUMBERS: BMS settings you can read and change from Home Assistant -----
# (battery capacity, voltage limits, current limits, temperature limits ...)
number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balance_trigger_voltage:
      name: "balance trigger voltage"

    cell_count:
      name: "cell count"

    total_battery_capacity:
      name: "total battery capacity"

    cell_voltage_overvoltage_protection:
      name: "cell voltage overvoltage protection"

    cell_voltage_overvoltage_recovery:
      name: "cell voltage overvoltage recovery"

    cell_voltage_undervoltage_protection:
      name: "cell voltage undervoltage protection"

    cell_voltage_undervoltage_recovery:
      name: "cell voltage undervoltage recovery"

    balancing_start_voltage:
      name: "balancing start voltage"

    voltage_calibration:
      name: "voltage calibration"

    current_calibration:
      name: "current calibration"

    power_off_voltage:
      name: "power off voltage"

    max_balance_current:
      name: "max balance current"

    max_charge_current:
      name: "max charge current"

    max_discharge_current:
      name: "max discharge current"

    charge_overcurrent_protection_delay:
      name: "charge overcurrent protection delay"

    charge_overcurrent_protection_recovery_time:
      name: "charge overcurrent protection recovery time"

    discharge_overcurrent_protection_delay:
      name: "discharge overcurrent protection delay"

    discharge_overcurrent_protection_recovery_time:
      name: "discharge overcurrent protection recovery time"

    short_circuit_protection_delay:
      name: "short circuit protection delay"

    short_circuit_protection_recovery_time:
      name: "short circuit protection recovery time"

    charge_overtemperature_protection:
      name: "charge overtemperature protection"

    charge_overtemperature_protection_recovery:
      name: "charge overtemperature protection recovery"

    discharge_overtemperature_protection:
      name: "discharge overtemperature protection"

    discharge_overtemperature_protection_recovery:
      name: "discharge overtemperature protection recovery"

    charge_undertemperature_protection:
      name: "charge undertemperature protection"

    charge_undertemperature_protection_recovery:
      name: "charge undertemperature protection recovery"

    mosfet_overtemperature_protection:
      name: "mosfet overtemperature protection"

    mosfet_overtemperature_protection_recovery:
      name: "mosfet overtemperature protection recovery"

# ---- SENSORS ----------------------------------------------------------------
sensor:
  # ---- 1) Data read directly from the BMS ----
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0

    # Cell voltage statistics (min/max/delta/average)
    min_cell_voltage:
      name: "min cell voltage"

    max_cell_voltage:
      name: "max cell voltage"

    min_voltage_cell:
      name: "min voltage cell"

    max_voltage_cell:
      name: "max voltage cell"

    delta_cell_voltage:
      name: "delta cell voltage"

    average_cell_voltage:
      name: "average cell voltage"

    # Individual cell voltages (24 slots; unused cells just stay unavailable)
    cell_voltage_1:
      name: "cell voltage 1"

    cell_voltage_2:
      name: "cell voltage 2"

    cell_voltage_3:
      name: "cell voltage 3"

    cell_voltage_4:
      name: "cell voltage 4"

    cell_voltage_5:
      name: "cell voltage 5"

    cell_voltage_6:
      name: "cell voltage 6"

    cell_voltage_7:
      name: "cell voltage 7"

    cell_voltage_8:
      name: "cell voltage 8"

    cell_voltage_9:
      name: "cell voltage 9"

    cell_voltage_10:
      name: "cell voltage 10"

    cell_voltage_11:
      name: "cell voltage 11"

    cell_voltage_12:
      name: "cell voltage 12"

    cell_voltage_13:
      name: "cell voltage 13"

    cell_voltage_14:
      name: "cell voltage 14"

    cell_voltage_15:
      name: "cell voltage 15"

    cell_voltage_16:
      name: "cell voltage 16"

    cell_voltage_17:
      name: "cell voltage 17"

    cell_voltage_18:
      name: "cell voltage 18"

    cell_voltage_19:
      name: "cell voltage 19"

    cell_voltage_20:
      name: "cell voltage 20"

    cell_voltage_21:
      name: "cell voltage 21"

    cell_voltage_22:
      name: "cell voltage 22"

    cell_voltage_23:
      name: "cell voltage 23"

    cell_voltage_24:
      name: "cell voltage 24"

    # Individual cell wire/connection resistances
    cell_resistance_1:
      name: "cell resistance 1"

    cell_resistance_2:
      name: "cell resistance 2"

    cell_resistance_3:
      name: "cell resistance 3"

    cell_resistance_4:
      name: "cell resistance 4"

    cell_resistance_5:
      name: "cell resistance 5"

    cell_resistance_6:
      name: "cell resistance 6"

    cell_resistance_7:
      name: "cell resistance 7"

    cell_resistance_8:
      name: "cell resistance 8"

    cell_resistance_9:
      name: "cell resistance 9"

    cell_resistance_10:
      name: "cell resistance 10"

    cell_resistance_11:
      name: "cell resistance 11"

    cell_resistance_12:
      name: "cell resistance 12"

    cell_resistance_13:
      name: "cell resistance 13"

    cell_resistance_14:
      name: "cell resistance 14"

    cell_resistance_15:
      name: "cell resistance 15"

    cell_resistance_16:
      name: "cell resistance 16"

    cell_resistance_17:
      name: "cell resistance 17"

    cell_resistance_18:
      name: "cell resistance 18"

    cell_resistance_19:
      name: "cell resistance 19"

    cell_resistance_20:
      name: "cell resistance 20"

    cell_resistance_21:
      name: "cell resistance 21"

    cell_resistance_22:
      name: "cell resistance 22"

    cell_resistance_23:
      name: "cell resistance 23"

    cell_resistance_24:
      name: "cell resistance 24"

    # Pack-level measurements: voltage, current, power
    total_voltage:
      name: "total voltage"

    current:
      name: "current"
      id: bms_current   # used by the advanced SoH calculation

    heating_current:
      name: "heating current"

    power:
      name: "power"

    charging_power:
      name: "charging power"

    discharging_power:
      name: "discharging power"

    # Temperature probes and MOSFET temperature
    temperature_sensor_1:
      name: "temperature sensor 1"
      id: bms_temp1     # used by the advanced SoH calculation

    temperature_sensor_2:
      name: "temperature sensor 2"
      id: bms_temp2     # used by the advanced SoH calculation

    temperature_sensor_3:
      name: "temperature sensor 3"

    temperature_sensor_4:
      name: "temperature sensor 4"

    mosfet_temperature:
      name: "mosfet temperature"

    # Balancer, capacity, runtime and counters
    balancer_status_bitmask:
      name: "balancer status bitmask"

    state_of_charge:
      name: "state of charge"

    capacity_remaining:
      name: "capacity remaining"

    full_charge_capacity:
      name: "full charge capacity"

    total_charging_cycle_capacity:
      name: "total charging cycle capacity"

    total_runtime:
      name: "total runtime"

    power_on_count:
      name: "power on count"

    balancing_current:
      name: "balancing current"

    # Cycle counter reported by the BMS.
    # The 'id' lets the SoH template sensors below read this value.
    charging_cycles:
      name: "charging cycles"
      id: bms_charging_cycles

  # ===========================================================================
  # 2) ESTIMATED STATE OF HEALTH (calculated on the ESP32, NOT read from BMS)
  #
  #   loss per cycle = (100 - end_of_life) / rated_cycles
  #                  = (100 - 80) / 5000 = 0.004 % per cycle
  #   SoH            = 100 - (cycles * loss per cycle)      (clamped 0..100)
  # ===========================================================================
  - platform: template                    # a sensor whose value is computed by our code
    name: "State of Health (Estimated)"   # name shown in Home Assistant
    id: soh_estimated                     # internal id (use it in other automations)
    unit_of_measurement: "%"              # displayed as a percentage
    icon: mdi:battery-heart-variant       # icon in Home Assistant
    state_class: measurement              # lets HA keep long-term statistics/graphs
    accuracy_decimals: 2                  # show 2 decimals, e.g. 98.00 %
    update_interval: 30s                  # recalculate every 30 seconds
    lambda: |-
      // STEP 1: if the BMS has not sent a cycle count yet, publish nothing.
      // (returning {} = "no value", avoids a false 100 % right after boot)
      if (!id(bms_charging_cycles).has_state()) return {};

      // STEP 2: read the current cycle count from the BMS sensor.
      const float cycles = id(bms_charging_cycles).state;

      // STEP 3: ignore invalid readings (NaN = "not a number").
      if (std::isnan(cycles)) return {};

      // STEP 4: calculate the SoH lost per cycle.
      // (100 - 80) / 5000 = 0.004 % per cycle with the default substitutions.
      // static_cast<float> converts the substitution text to a decimal number.
      const float loss_per_cycle = (100.0f - static_cast<float>(${soh_end_of_life})) / static_cast<float>(${soh_rated_cycles});

      // STEP 5: SoH = 100 % minus total loss so far.
      float soh = 100.0f - (cycles * loss_per_cycle);

      // STEP 6: keep the result inside a sensible 0 - 100 % range.
      if (soh > 100.0f) soh = 100.0f;
      if (soh < 0.0f) soh = 0.0f;

      // STEP 7: publish the value to Home Assistant.
      return soh;

  # Cycles left until the battery reaches the end-of-life SoH (80 %)
  - platform: template                    # another calculated sensor
    name: "Cycles Remaining To End Of Life"
    id: cycles_remaining_eol
    unit_of_measurement: "cycles"
    icon: mdi:battery-sync
    state_class: measurement
    accuracy_decimals: 0                  # whole numbers only
    update_interval: 30s                  # recalculate every 30 seconds
    lambda: |-
      // STEP 1: wait until the BMS has reported a cycle count.
      if (!id(bms_charging_cycles).has_state()) return {};

      // STEP 2: read the current cycle count.
      const float cycles = id(bms_charging_cycles).state;

      // STEP 3: ignore invalid readings.
      if (std::isnan(cycles)) return {};

      // STEP 4: remaining = rated cycles (5000) - cycles already used.
      float remaining = static_cast<float>(${soh_rated_cycles}) - cycles;

      // STEP 5: never show a negative number once past the rated life.
      if (remaining < 0.0f) remaining = 0.0f;

      // STEP 6: publish the value to Home Assistant.
      return remaining;

  # ===========================================================================
  # 3) ADVANCED STATE OF HEALTH ESTIMATE
  #    Uses the running loss total from the 'interval' block above.
  #    Takes into account cycles, temperature, current (C-rate) and calendar age.
  # ===========================================================================
  - platform: template
    name: "State of Health (Advanced Estimate)"
    id: soh_advanced
    unit_of_measurement: "%"
    icon: mdi:battery-heart-variant
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      // Wait until the loss total has been seeded from the BMS cycle count.
      if (!id(soh_seeded)) return {};
      // SoH = 100 % minus total accumulated loss, kept within 0 - 100 %.
      float soh = 100.0f - static_cast<float>(id(soh_total_loss));
      if (soh > 100.0f) soh = 100.0f;
      if (soh < 0.0f) soh = 0.0f;
      return soh;

  # Current wear multiplier: 1.0 = datasheet conditions, 2.0 = wearing twice as fast
  - platform: template
    name: "Battery Aging Stress Factor"
    id: aging_stress_factor
    unit_of_measurement: "x"
    icon: mdi:thermometer-alert
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      return id(soh_stress_now);

  # Equivalent full cycles counted by the ESP32 from energy throughput
  # (counts from when the advanced tracking started)
  - platform: template
    name: "Equivalent Full Cycles (Tracked)"
    id: equiv_full_cycles
    unit_of_measurement: "cycles"
    icon: mdi:counter
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return static_cast<float>(id(soh_equiv_cycles));

# ---- SWITCHES: turn BMS functions on/off from Home Assistant ----------------
switch:
  # Charge MOSFET, discharge MOSFET and balancer switches
  - platform: jk_bms_ble
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    balancer:
      name: "balancer"
  # Master switch to enable/disable the Bluetooth connection
  # (also used by OTA to pause BLE during updates)
  - platform: ble_client
    ble_client_id: client0
    name: "enable bluetooth connection"
    id: ble_client_switch0

# ---- TEXT SENSORS: errors, versions, serial number --------------------------
text_sensor:
  - platform: jk_bms_ble
    errors:
      name: "errors"
    errors_bitmask_hex:
      name: "errors bitmask hex"
    balancer_status:
      name: "balancer status"
    total_runtime_formatted:
      name: "total runtime formatted"
    software_version:
      name: "software version"
    hardware_version:
      name: "hardware version"
    device_model:
      name: "device model"
    manufacturing_date:
      name: "manufacturing date"
    serial_number:
      name: "serial number"
