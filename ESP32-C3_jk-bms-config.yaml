# =============================================================================
# JK-BMS (BLE) -> ESP32-C3 Super Mini -> Home Assistant
# Based on syssi/esphome-jk-bms, with an added ESTIMATED State of Health (SoH)
# calculated from the BMS charging-cycle counter, plus an ADVANCED SoH estimate
# that also considers temperature, C-rate (current) and calendar time.
# =============================================================================

# ---- SUBSTITUTIONS: reusable values, referenced below as ${name} ------------
substitutions:
  name: jk-bms
  device_description: "Monitor and control a JK-BMS via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  protocol_version: JK02_32S   # JK02_24S (HW 6.0-11.0), JK02_32S (HW 11.0+), JK04 (HW <= 3.0)

  # SoH model (Highstar IFpP40130220-100 datasheet: >= 5000 cycles to 80 %)
  soh_rated_cycles: "5000"
  soh_end_of_life: "80.0"

  # Advanced SoH (stress factors are assumptions, not lab values)
  soh_pack_capacity_ah: "100"        # total pack Ah (16S1P of 100 Ah = 100)
  soh_ref_temp_c: "25.0"
  soh_ref_c_rate: "0.5"
  soh_temp_doubling_c: "10.0"        # wear doubles per +10 C
  soh_c_rate_gamma: "0.5"
  soh_calendar_loss_per_year: "1.0"  # % per year at ref temp, mid SoC (0 = off)

  soh_cold_charge_below_c: "10.0"
  soh_cold_charge_k: "0.15"
  soh_cold_charge_max_factor: "20.0"

  soh_soc_high_start: "70.0"
  soh_soc_high_factor: "1.5"         # calendar wear multiplier at 100 % SoC

  # Automatic capacity test
  soh_cal_full_cell_v: "3.42"        # highest cell at/above this = pack full, test is armed
  soh_cal_start_cell_v: "3.40"       # counting starts when the highest cell falls to this
  soh_cal_empty_cell_v: "3.00"       # test ends when the lowest cell falls to this
  soh_cal_max_charge_ah: "0.2"       # abort only if more than this many Ah are charged during the test
  soh_cal_capacity_correction: "1.00"
  soh_cal_blend: "0.5"               # 1.0 = overwrite, 0.5 = halfway
  soh_cal_min_temp_c: "15.0"
  soh_cal_max_temp_c: "40.0"
  soh_cal_max_c_rate: "0.7"
  soh_dir_threshold_w: "5.0"

esphome:
  name: ${name}

# saved values are written to flash every 30 minutes
preferences:
  flash_write_interval: 30min

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

# SoH state (restore_value: yes = kept in flash)
globals:
  - id: soh_total_loss
    type: double
    restore_value: yes
    initial_value: '0.0'

  - id: soh_seeded
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: soh_equiv_cycles
    type: double
    restore_value: yes
    initial_value: '0.0'

  - id: soh_stress_now
    type: float
    restore_value: no
    initial_value: '1.0'

  - id: soh_last_cap
    type: double
    restore_value: yes
    initial_value: '0.0'

  - id: soh_cal_state
    type: int
    restore_value: no
    initial_value: '0'

  - id: soh_cal_ah
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: soh_cal_chg_ah
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: soh_cal_tsum
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: soh_cal_n
    type: int
    restore_value: no
    initial_value: '0'

  - id: soh_cal_msg
    type: std::string
    restore_value: no
    initial_value: '"Waiting for a full charge"'

# advanced SoH wear model + automatic capacity test, every 10 s
interval:
  - interval: 10s
    then:
      - lambda: |-
          const double loss_per_cycle = (100.0 - static_cast<double>(${soh_end_of_life})) / static_cast<double>(${soh_rated_cycles});

          if (!id(soh_seeded)) {
            if (!id(bms_charging_cycles).has_state()) return;
            const float c0 = id(bms_charging_cycles).state;
            if (std::isnan(c0)) return;
            id(soh_total_loss) = c0 * loss_per_cycle;
            id(soh_seeded) = true;
          }

          float t_sum = 0.0f;
          float t_min = 1000.0f;
          int t_n = 0;
          if (id(bms_temp1).has_state() && !std::isnan(id(bms_temp1).state)) {
            const float t = id(bms_temp1).state; t_sum += t; if (t < t_min) t_min = t; t_n++;
          }
          if (id(bms_temp2).has_state() && !std::isnan(id(bms_temp2).state)) {
            const float t = id(bms_temp2).state; t_sum += t; if (t < t_min) t_min = t; t_n++;
          }
          const float temp_c = (t_n > 0) ? (t_sum / t_n) : static_cast<float>(${soh_ref_temp_c});
          const float temp_cold = (t_n > 0) ? t_min : static_cast<float>(${soh_ref_temp_c});

          float amps = 0.0f;
          if (id(bms_current).has_state() && !std::isnan(id(bms_current).state)) {
            amps = std::fabs(id(bms_current).state);
          }

          float p_chg = 0.0f;
          if (id(bms_charging_power).has_state() && !std::isnan(id(bms_charging_power).state)) {
            p_chg = id(bms_charging_power).state;
          }
          const bool charging = p_chg > static_cast<float>(${soh_dir_threshold_w});

          float temp_factor = std::pow(2.0f, (temp_c - static_cast<float>(${soh_ref_temp_c})) / static_cast<float>(${soh_temp_doubling_c}));
          if (temp_factor < 1.0f) temp_factor = 1.0f;
          if (temp_factor > 4.0f) temp_factor = 4.0f;

          const float cap_ah = static_cast<float>(${soh_pack_capacity_ah});
          const float c_rate = amps / cap_ah;
          float c_factor = 1.0f;
          if (c_rate > static_cast<float>(${soh_ref_c_rate})) {
            c_factor = 1.0f + static_cast<float>(${soh_c_rate_gamma}) * (c_rate - static_cast<float>(${soh_ref_c_rate}));
          }
          if (c_factor > 3.0f) c_factor = 3.0f;

          float cold_factor = 1.0f;
          if (charging && temp_cold < static_cast<float>(${soh_cold_charge_below_c})) {
            cold_factor = std::exp(static_cast<float>(${soh_cold_charge_k}) * (static_cast<float>(${soh_cold_charge_below_c}) - temp_cold));
            if (cold_factor > static_cast<float>(${soh_cold_charge_max_factor})) cold_factor = static_cast<float>(${soh_cold_charge_max_factor});
          }

          float soc_factor = 1.0f;
          if (id(bms_soc).has_state() && !std::isnan(id(bms_soc).state)) {
            float soc = id(bms_soc).state;
            if (soc > 100.0f) soc = 100.0f;
            const float soc_start = static_cast<float>(${soh_soc_high_start});
            if (soc > soc_start) {
              soc_factor = 1.0f + ((soc - soc_start) / (100.0f - soc_start)) * (static_cast<float>(${soh_soc_high_factor}) - 1.0f);
            }
          }

          const double dt_h = 10.0 / 3600.0;

          const double efc_step = (static_cast<double>(amps) * dt_h) / (2.0 * cap_ah);
          id(soh_equiv_cycles) += efc_step;
          const double loss_cycling = efc_step * loss_per_cycle * temp_factor * c_factor * (charging ? cold_factor : 1.0f);

          const double loss_calendar = (static_cast<double>(${soh_calendar_loss_per_year}) / 8760.0) * dt_h * temp_factor * soc_factor;

          id(soh_total_loss) += loss_cycling + loss_calendar;
          if (id(soh_total_loss) > 100.0) id(soh_total_loss) = 100.0;
          if (id(soh_total_loss) < 0.0) id(soh_total_loss) = 0.0;

          id(soh_stress_now) = (amps > 0.0f) ? (temp_factor * c_factor * (charging ? cold_factor : 1.0f)) : temp_factor;

      - lambda: |-
          if (!id(soh_seeded)) return;

          const float cap_ah = static_cast<float>(${soh_pack_capacity_ah});
          const float thr = static_cast<float>(${soh_dir_threshold_w});
          const float dt_h = 10.0f / 3600.0f;

          const bool online = id(bms_online).has_state() && id(bms_online).state;
          if (!online) {
            if (id(soh_cal_state) != 0) {
              id(soh_cal_state) = 0;
              id(soh_cal_msg) = "Aborted: BMS went offline during the test";
            }
            return;
          }

          const float vmax = (id(bms_max_cell_v).has_state() && !std::isnan(id(bms_max_cell_v).state)) ? id(bms_max_cell_v).state : 0.0f;
          const float vmin = (id(bms_min_cell_v).has_state() && !std::isnan(id(bms_min_cell_v).state)) ? id(bms_min_cell_v).state : 99.0f;
          const float p_chg = (id(bms_charging_power).has_state() && !std::isnan(id(bms_charging_power).state)) ? id(bms_charging_power).state : 0.0f;
          const float p_dis = (id(bms_discharging_power).has_state() && !std::isnan(id(bms_discharging_power).state)) ? id(bms_discharging_power).state : 0.0f;
          const float amps = (id(bms_current).has_state() && !std::isnan(id(bms_current).state)) ? std::fabs(id(bms_current).state) : 0.0f;
          float t_sum = 0.0f;
          int t_n = 0;
          if (id(bms_temp1).has_state() && !std::isnan(id(bms_temp1).state)) { t_sum += id(bms_temp1).state; t_n++; }
          if (id(bms_temp2).has_state() && !std::isnan(id(bms_temp2).state)) { t_sum += id(bms_temp2).state; t_n++; }
          const float temp_c = (t_n > 0) ? (t_sum / t_n) : static_cast<float>(${soh_ref_temp_c});
          const bool charging = p_chg > thr;
          const bool discharging = p_dis > thr;

          if (id(soh_cal_state) == 0) {
            if (vmax >= static_cast<float>(${soh_cal_full_cell_v})) {
              id(soh_cal_state) = 1;
              id(soh_cal_msg) = "Armed: pack is full, waiting for a discharge";
            }
            return;
          }

          if (id(soh_cal_state) == 1) {
            if (vmax > static_cast<float>(${soh_cal_start_cell_v})) {
              id(soh_cal_msg) = "Armed: pack is full, waiting for a discharge";
              return;
            }
            id(soh_cal_state) = 2;
            id(soh_cal_ah) = 0.0;
            id(soh_cal_chg_ah) = 0.0;
            id(soh_cal_tsum) = 0.0;
            id(soh_cal_n) = 0;
          }

          if (id(soh_cal_state) == 2) {
            if (charging) {
              id(soh_cal_chg_ah) += static_cast<double>(amps) * dt_h;
              if (id(soh_cal_chg_ah) > static_cast<double>(${soh_cal_max_charge_ah})) {
                char abuf[80];
                snprintf(abuf, sizeof(abuf), "Aborted: more than %.1f Ah charged before the pack was empty", static_cast<float>(${soh_cal_max_charge_ah}));
                id(soh_cal_state) = 0;
                id(soh_cal_msg) = abuf;
                return;
              }
            } else if (discharging) {
              id(soh_cal_ah) += static_cast<double>(amps) * dt_h;
              id(soh_cal_tsum) += temp_c;
              id(soh_cal_n) += 1;
            }

            if (!(vmin <= static_cast<float>(${soh_cal_empty_cell_v})) || id(soh_cal_n) == 0) {
              char prog[64];
              snprintf(prog, sizeof(prog), "Counting discharge: %.1f Ah delivered so far", static_cast<float>(id(soh_cal_ah) - id(soh_cal_chg_ah)));
              id(soh_cal_msg) = prog;
              return;
            }

            const float ah_out = static_cast<float>(id(soh_cal_ah) - id(soh_cal_chg_ah));
            const float measured = ah_out * static_cast<float>(${soh_cal_capacity_correction});
            const float avg_temp = static_cast<float>(id(soh_cal_tsum)) / id(soh_cal_n);
            const float hours = id(soh_cal_n) * dt_h;
            const float avg_c = (static_cast<float>(id(soh_cal_ah)) / hours) / cap_ah;
            char buf[110];
            id(soh_cal_state) = 0;

            if (avg_temp < static_cast<float>(${soh_cal_min_temp_c}) || avg_temp > static_cast<float>(${soh_cal_max_temp_c})) {
              snprintf(buf, sizeof(buf), "Rejected: average temperature %.1f C is outside %.0f to %.0f C", avg_temp, static_cast<float>(${soh_cal_min_temp_c}), static_cast<float>(${soh_cal_max_temp_c}));
              id(soh_cal_msg) = buf;
              return;
            }
            if (avg_c > static_cast<float>(${soh_cal_max_c_rate})) {
              snprintf(buf, sizeof(buf), "Rejected: discharged too fast (%.2f C average)", avg_c);
              id(soh_cal_msg) = buf;
              return;
            }
            if (measured < 0.5f * cap_ah) {
              snprintf(buf, sizeof(buf), "Rejected: only %.1f Ah delivered, test did not start from full", measured);
              id(soh_cal_msg) = buf;
              return;
            }
            if (measured > 1.15f * cap_ah) {
              snprintf(buf, sizeof(buf), "Rejected: %.1f Ah is far above the rated capacity", measured);
              id(soh_cal_msg) = buf;
              return;
            }

            const float m_capped = (measured > cap_ah) ? cap_ah : measured;
            const double loss_measured = 100.0 * (1.0 - static_cast<double>(m_capped) / cap_ah);
            id(soh_last_cap) = measured;

            id(soh_total_loss) += static_cast<double>(${soh_cal_blend}) * (loss_measured - id(soh_total_loss));
            if (id(soh_total_loss) > 100.0) id(soh_total_loss) = 100.0;
            if (id(soh_total_loss) < 0.0) id(soh_total_loss) = 0.0;
            snprintf(buf, sizeof(buf), "Accepted: %.1f Ah measured, advanced SoH corrected to %.1f %%", measured, static_cast<float>(100.0 - id(soh_total_loss)));
            id(soh_cal_msg) = buf;
          }

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

api:
  encryption:
    key: "XXX"   # put your own API encryption key here

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms0_mac_address
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 5s
    id: bms0

binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "balancing"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    heating:
      name: "heating"
    online_status:
      name: "online status"
      id: bms_online

button:
  - platform: template
    name: "Apply Measured Capacity"
    icon: mdi:check-circle
    entity_category: config
    on_press:
      - lambda: |-
          const float cap_ah = static_cast<float>(${soh_pack_capacity_ah});
          const float m = id(soh_manual_capacity_input).state;
          if (std::isnan(m) || m <= 0.0f || m > 1.5f * cap_ah) {
            id(soh_cal_msg) = "Manual entry rejected: value is out of range";
            return;
          }
          const float m_capped = (m > cap_ah) ? cap_ah : m;
          id(soh_total_loss) = 100.0 * (1.0 - static_cast<double>(m_capped) / cap_ah);
          id(soh_last_cap) = m;
          id(soh_seeded) = true;
          char buf[90];
          snprintf(buf, sizeof(buf), "Manual: %.1f Ah applied, advanced SoH set to %.1f %%", m, static_cast<float>(100.0 - id(soh_total_loss)));
          id(soh_cal_msg) = buf;

  - platform: template
    name: "Reset Advanced SoH Tracking"
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: |-
          id(soh_seeded) = false;
          id(soh_equiv_cycles) = 0.0;
          id(soh_cal_state) = 0;
          id(soh_cal_msg) = "Tracking reset: waiting for a full charge";

  - platform: jk_bms_ble
    retrieve_settings:
      name: "retrieve settings"
    retrieve_device_info:
      name: "retrieve device info"
    retrieve_logbook:
      name: "retrieve logbook"

number:
  - platform: template
    name: "Measured Capacity Input"
    id: soh_manual_capacity_input
    icon: mdi:battery-check
    unit_of_measurement: "Ah"
    optimistic: true
    restore_value: true
    initial_value: ${soh_pack_capacity_ah}
    min_value: 1
    max_value: 1000
    step: 0.1
    mode: box
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balance_trigger_voltage:
      name: "balance trigger voltage"

    cell_count:
      name: "cell count"

    total_battery_capacity:
      name: "total battery capacity"

    cell_voltage_overvoltage_protection:
      name: "cell voltage overvoltage protection"

    cell_voltage_overvoltage_recovery:
      name: "cell voltage overvoltage recovery"

    cell_voltage_undervoltage_protection:
      name: "cell voltage undervoltage protection"

    cell_voltage_undervoltage_recovery:
      name: "cell voltage undervoltage recovery"

    balancing_start_voltage:
      name: "balancing start voltage"

    voltage_calibration:
      name: "voltage calibration"

    current_calibration:
      name: "current calibration"

    power_off_voltage:
      name: "power off voltage"

    max_balance_current:
      name: "max balance current"

    max_charge_current:
      name: "max charge current"

    max_discharge_current:
      name: "max discharge current"

    charge_overcurrent_protection_delay:
      name: "charge overcurrent protection delay"

    charge_overcurrent_protection_recovery_time:
      name: "charge overcurrent protection recovery time"

    discharge_overcurrent_protection_delay:
      name: "discharge overcurrent protection delay"

    discharge_overcurrent_protection_recovery_time:
      name: "discharge overcurrent protection recovery time"

    short_circuit_protection_delay:
      name: "short circuit protection delay"

    short_circuit_protection_recovery_time:
      name: "short circuit protection recovery time"

    charge_overtemperature_protection:
      name: "charge overtemperature protection"

    charge_overtemperature_protection_recovery:
      name: "charge overtemperature protection recovery"

    discharge_overtemperature_protection:
      name: "discharge overtemperature protection"

    discharge_overtemperature_protection_recovery:
      name: "discharge overtemperature protection recovery"

    charge_undertemperature_protection:
      name: "charge undertemperature protection"

    charge_undertemperature_protection_recovery:
      name: "charge undertemperature protection recovery"

    mosfet_overtemperature_protection:
      name: "mosfet overtemperature protection"

    mosfet_overtemperature_protection_recovery:
      name: "mosfet overtemperature protection recovery"

sensor:
