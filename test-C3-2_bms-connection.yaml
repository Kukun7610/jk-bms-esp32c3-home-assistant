    jk_bms_ble_id: bms0
    charging:
      name: "bms0 charging switch"
    discharging:
      name: "bms0 discharging switch"
    balancer:
      name: "bms0 balancer switch"
  - platform: jk_bms_ble
    jk_bms_ble_id: bms1
    charging:
      name: "bms1 charging switch"
    discharging:
      name: "bms1 discharging switch"
    balancer:
      name: "bms1 balancer switch"

  - platform: ble_client
    ble_client_id: client0
    name: "bms0 enable bluetooth connection"
    id: ble_client_switch0
  - platform: ble_client
    ble_client_id: client1
    name: "bms1 enable bluetooth connection"
    id: ble_client_switch1

text_sensor:
