# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml



####
substitutions:
  name: jk-bms
  device_description: "Monitor and control two JK-BMS units via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  # JK02_24S = hardware version 6.0 to <11.0, JK02_32S = hardware version >= 11.0, JK04 = old <= 3.0
  protocol_version_bms0: JK02_32S
  protocol_version_bms1: JK02_32S

esphome:
  name: ${name}
  comment: ${device_description}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - switch.turn_off: ble_client_switch1
      - logger.log: "BLE connections suspended for OTA update"

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

api:
  encryption:
    key: "00bZjLWfoWLxaOZeoUqi5pyzXz0epN5oXIGKuRhgQvM="
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms0_mac_address
    id: client0
  - mac_address: !secret bms1_mac_address
    id: client1

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version_bms0}
    throttle: 10s
    id: bms0
  - ble_client_id: client1
    protocol_version: ${protocol_version_bms1}
    throttle: 10s
    id: bms1

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balancing:
      name: "bms0 balancing"
    charging:
      name: "bms0 charging"
    discharging:
      name: "bms0 discharging"
    online_status:
      name: "bms0 online status"
  - platform: jk_bms_ble
    jk_bms_ble_id: bms1
    balancing:
      name: "bms1 balancing"
    charging:
      name: "bms1 charging"
    discharging:
      name: "bms1 discharging"
    online_status:
      name: "bms1 online status"

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    retrieve_settings:
      name: "bms0 retrieve settings"
    retrieve_device_info:
      name: "bms0 retrieve device info"
  - platform: jk_bms_ble
    jk_bms_ble_id: bms1
    retrieve_settings:
      name: "bms1 retrieve settings"
    retrieve_device_info:
      name: "bms1 retrieve device info"

